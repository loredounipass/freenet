version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - backend-mongodb:/data/db
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - backend-redis:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  backend-mongodb:
    driver: local
  backend-redis:
    driver: local